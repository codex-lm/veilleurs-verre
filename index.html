<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#102e33">
  <meta name="description" content="Guide three glass wardens through tactical card battles and relight a ruined city's lighthouse.">
  <title>The Glass Wardens</title>
  <style>:root {
  --ink: #102e33;
  --ink-soft: #285058;
  --deep: #092228;
  --paper: #f2eee4;
  --paper-2: #e5dfcf;
  --turquoise: #43cbb9;
  --turquoise-light: #b6fff0;
  --amber: #e8a84c;
  --amber-light: #ffe1a0;
  --plum: #8f4e78;
  --plum-deep: #4d2948;
  --white: #f6fffb;
  --danger: #c75d56;
  --shadow: 0 16px 40px rgba(4, 25, 29, .18);
  --display: Georgia, 'Times New Roman', serif;
  --body: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; }
html { min-height: 100%; background: var(--deep); }
body { margin: 0; min-width: 320px; min-height: 100vh; color: var(--ink); font-family: var(--body); background: radial-gradient(circle at 85% 5%, rgba(67,203,185,.14), transparent 32rem), linear-gradient(145deg, #0d3438, var(--deep) 70%); }
button, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, [role=button]:focus-visible { outline: 3px solid var(--amber-light); outline-offset: 3px; }
button { cursor: pointer; }
button:disabled { cursor: not-allowed; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.loading { min-height: 100vh; display: grid; place-content: center; text-align: center; color: var(--white); }
.loading-gem { display: block; width: 42px; height: 58px; margin: auto; background: linear-gradient(135deg, var(--white), var(--turquoise)); clip-path: polygon(50% 0,100% 38%,72% 100%,28% 100%,0 38%); animation: breathe 1.4s infinite; }
.app-shell { width: min(1480px, 100%); min-height: 100vh; margin: 0 auto; background: var(--paper); box-shadow: 0 0 80px rgba(0,0,0,.28); }
.topbar { min-height: 68px; padding: 10px 20px; display: flex; align-items: center; gap: 18px; color: var(--white); background: rgba(9,34,40,.97); border-bottom: 1px solid rgba(182,255,240,.18); }
.brand-button { display: flex; align-items: center; gap: 10px; padding: 0; color: inherit; background: none; border: 0; text-align: left; }
.brand-mark { width: 34px; height: 43px; filter: drop-shadow(0 0 8px rgba(67,203,185,.28)); }
.brand-name { font: 600 20px/1 var(--display); letter-spacing: .01em; }
.brand-sub { display: block; margin-top: 5px; color: #9fc7c3; font: 500 9px/1 var(--body); letter-spacing: .18em; text-transform: uppercase; }
.topbar-spacer { flex: 1; }
.seed-chip { color: #a9cbc6; font-size: 11px; letter-spacing: .06em; }
.icon-button, .language-button { min-width: 40px; min-height: 40px; padding: 8px 10px; border: 1px solid rgba(182,255,240,.22); border-radius: 10px; color: #d7eeea; background: rgba(255,255,255,.04); }
.icon-button:hover, .language-button:hover, .language-button.active { background: rgba(67,203,185,.16); border-color: var(--turquoise); }
.language-group { display: flex; gap: 4px; }
.language-button { min-width: 36px; min-height: 36px; padding: 6px; font-size: 10px; font-weight: 800; }
.screen { min-height: calc(100vh - 68px); }
.home { position: relative; overflow: hidden; background: linear-gradient(180deg, rgba(242,238,228,0) 55%, rgba(67,203,185,.09)); }
.home::before { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .38; background-image: radial-gradient(rgba(16,46,51,.15) .6px, transparent .6px); background-size: 7px 7px; }
.home-hero { position: relative; display: grid; grid-template-columns: 1.08fr .92fr; align-items: center; gap: 30px; min-height: calc(100vh - 150px); padding: clamp(34px, 6vw, 86px); }
.eyebrow { display: flex; align-items: center; gap: 10px; margin: 0 0 16px; color: var(--plum); font-size: 11px; font-weight: 800; letter-spacing: .19em; text-transform: uppercase; }
.eyebrow::before { content: ''; width: 30px; height: 1px; background: currentColor; }
.home h1 { max-width: 660px; margin: 0; color: var(--ink); font: 500 clamp(48px, 6.4vw, 88px)/.96 var(--display); letter-spacing: -.045em; }
.home h1 em { display: block; color: var(--plum); font-weight: 400; }
.home-lead { max-width: 560px; margin: 26px 0 30px; color: var(--ink-soft); font: 400 clamp(16px, 1.5vw, 20px)/1.65 var(--body); }
.home-actions { display: flex; flex-wrap: wrap; gap: 12px; }
.primary-button, .secondary-button, .text-button, .danger-button { min-height: 46px; padding: 12px 20px; border-radius: 12px; font-weight: 750; border: 1px solid transparent; transition: transform .16s, box-shadow .16s, background .16s; }
.primary-button { color: var(--white); background: var(--ink); box-shadow: 0 8px 20px rgba(16,46,51,.2); }
.primary-button:hover { transform: translateY(-2px); background: #17464b; box-shadow: 0 12px 24px rgba(16,46,51,.24); }
.secondary-button { color: var(--ink); background: rgba(255,255,255,.45); border-color: rgba(16,46,51,.24); }
.secondary-button:hover { background: var(--white); border-color: var(--turquoise); }
.text-button { color: var(--ink-soft); background: transparent; border-color: transparent; }
.text-button:hover { background: rgba(16,46,51,.07); }
.danger-button { color: var(--white); background: var(--plum-deep); }
.home-note { display: flex; align-items: center; gap: 8px; margin-top: 18px; color: var(--ink-soft); font-size: 12px; }
.home-note::before { content: ''; width: 7px; height: 7px; transform: rotate(45deg); background: var(--turquoise); }
.home-art { position: relative; min-height: 500px; display: grid; place-items: center; }
.lighthouse-halo { position: absolute; width: 390px; height: 390px; border-radius: 50%; border: 1px solid rgba(16,46,51,.13); }
.lighthouse-halo::before, .lighthouse-halo::after { content: ''; position: absolute; border-radius: 50%; inset: 42px; border: 1px solid rgba(16,46,51,.1); }
.lighthouse-halo::after { inset: 94px; background: radial-gradient(circle, rgba(67,203,185,.22), transparent 68%); border: 0; }
.home-figures { position: relative; width: min(460px, 100%); filter: drop-shadow(0 30px 25px rgba(16,46,51,.2)); }
.home-figures svg { display: block; width: 100%; }
.feature-strip { position: relative; display: grid; grid-template-columns: repeat(3,1fr); border-top: 1px solid rgba(16,46,51,.12); background: rgba(255,255,255,.32); }
.feature { padding: 22px clamp(20px,4vw,60px); display: flex; gap: 14px; align-items: center; color: var(--ink-soft); font-size: 12px; line-height: 1.45; }
.feature + .feature { border-left: 1px solid rgba(16,46,51,.12); }
.feature-icon { flex: 0 0 auto; display: grid; place-items: center; width: 34px; height: 34px; color: var(--plum); border: 1px solid currentColor; transform: rotate(45deg); }
.feature-icon span { transform: rotate(-45deg); font-weight: 800; }
.game-layout { display: grid; grid-template-columns: minmax(0,1fr) 290px; min-height: calc(100vh - 68px); }
.battle-main { min-width: 0; padding: 18px clamp(12px,2vw,28px) 22px; background: linear-gradient(180deg, #e9e5d9, #dcd8cb); }
.battle-sidebar { padding: 20px 18px; color: #e7f4f0; background: linear-gradient(180deg, #173c40, #102e33); border-left: 1px solid rgba(255,255,255,.08); }
.battle-heading { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 14px; }
.battle-heading h1, .map-title h1, .choice-heading h1 { margin: 0; font: 500 28px/1.1 var(--display); }
.battle-heading p, .map-title p, .choice-heading p { margin: 6px 0 0; color: var(--ink-soft); font-size: 12px; }
.turn-chip { margin-left: auto; padding: 8px 12px; border: 1px solid rgba(16,46,51,.18); border-radius: 10px; color: var(--ink-soft); background: rgba(255,255,255,.4); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; }
.boss-phase { flex-basis: 100%; padding: 10px 12px; color: var(--plum-deep); background: #efd6e5; border-left: 3px solid var(--plum); font-size: 12px; line-height: 1.45; }
.battle-status { display: flex; align-items: center; gap: 16px; margin-bottom: 12px; }
.energy-meter { display: flex; align-items: center; gap: 6px; }
.energy-label { margin-right: 4px; color: var(--ink-soft); font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
.energy-orb { width: 23px; height: 27px; display: grid; place-items: center; color: var(--ink); font-size: 10px; font-weight: 900; background: linear-gradient(135deg, var(--white), var(--turquoise)); clip-path: polygon(50% 0,100% 35%,76% 100%,24% 100%,0 35%); filter: drop-shadow(0 2px 3px rgba(16,46,51,.2)); }
.energy-orb.empty { background: #b4b8ad; opacity: .42; }
.pile-count { color: var(--ink-soft); font-size: 11px; }
.pile-count strong { color: var(--ink); }
.board-frame { position: relative; width: min(100%, 840px); margin: 0 auto; padding: 14px; border: 1px solid #b4b0a5; border-radius: 18px; background: linear-gradient(135deg, #c5c1b5, #f0ece2 45%, #b9b5aa); box-shadow: 0 14px 30px rgba(16,46,51,.18), inset 0 1px rgba(255,255,255,.8); }
.board { position: relative; display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; width: 100%; aspect-ratio: 7/5; padding: 6px; border-radius: 11px; background: #838b82; box-shadow: inset 0 2px 8px rgba(16,46,51,.3); }
.cell { position: relative; min-width: 0; min-height: 0; overflow: hidden; border: 1px solid rgba(255,255,255,.42); border-radius: 7px; background: linear-gradient(145deg, #e4e2d7, #c9cec1); box-shadow: inset 0 -4px 8px rgba(16,46,51,.09); cursor: pointer; user-select: none; }
.cell:nth-child(3n) { background: linear-gradient(145deg, #dedfd3, #c4cbbb); }
.cell::after { content: ''; position: absolute; inset: 0; pointer-events: none; opacity: .24; background: linear-gradient(115deg, transparent 35%, rgba(255,255,255,.8) 36%, transparent 39%); }
.cell-coordinate { position: absolute; left: 4px; bottom: 2px; z-index: 1; color: rgba(16,46,51,.36); font-size: clamp(6px,1vw,9px); font-weight: 800; }
.cell.threatened { background-color: #ead2b5; background-image: repeating-linear-gradient(135deg, rgba(143,78,120,.09) 0 4px, transparent 4px 9px), linear-gradient(145deg, #eee0c9, #d6c3ae); }
.threat-marker { position: absolute; z-index: 4; right: 3px; bottom: 3px; min-width: 20px; padding: 2px 4px; border-radius: 5px; color: var(--white); background: var(--plum-deep); font-size: clamp(7px,1vw,10px); font-weight: 900; text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.cell.legal { border: 2px solid var(--turquoise); box-shadow: inset 0 0 0 2px rgba(246,255,251,.7), 0 0 12px rgba(67,203,185,.36); }
.cell.legal::before { content: ''; position: absolute; z-index: 5; left: 50%; top: 50%; width: 12px; height: 12px; transform: translate(-50%,-50%) rotate(45deg); border: 2px solid var(--ink); background: var(--turquoise-light); opacity: .85; }
.cell.legal:has(.unit)::before, .cell.legal:has(.crystal)::before { width: auto; height: auto; content: '◆'; display: grid; place-items: center; padding: 3px; color: var(--ink); background: var(--turquoise-light); font-size: 10px; }
.cell.chosen { border: 3px solid var(--amber); box-shadow: 0 0 16px rgba(232,168,76,.6); }
.cell.obstacle { cursor: default; background: linear-gradient(145deg, #8d9187, #646e68); }
.obstacle-shape { position: absolute; inset: 13% 10% 18%; border: 1px solid rgba(255,255,255,.25); border-radius: 5px 8px 4px 7px; background: linear-gradient(135deg, #a9aca0, #6d7770); box-shadow: 5px 7px 0 #515d58, inset 2px 2px rgba(255,255,255,.22); }
.obstacle-shape::after { content: ''; position: absolute; inset: 20% 25%; border-left: 2px solid rgba(16,46,51,.25); transform: rotate(28deg); }
.hazard-shape { position: absolute; inset: 18%; opacity: .65; background: var(--plum); clip-path: polygon(0 100%,12% 43%,26% 76%,41% 10%,52% 72%,70% 29%,77% 75%,100% 49%,88% 100%); }
.crystal { position: absolute; z-index: 3; inset: 9% 20% 8%; display: grid; place-items: center; filter: drop-shadow(0 0 8px rgba(67,203,185,.6)); }
.crystal svg { width: 100%; height: 100%; animation: crystalGlow 2.4s ease-in-out infinite; }
.unit { position: absolute; z-index: 6; inset: 2% 8% 5%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; pointer-events: none; }
.unit-svg { flex: 1; width: 100%; min-height: 0; display: grid; place-items: center; filter: drop-shadow(0 5px 3px rgba(16,46,51,.28)); }
.unit-svg svg { width: 100%; height: 100%; overflow: visible; }
.unit.hero .unit-svg { animation: heroIdle 3s ease-in-out infinite; }
.unit.enemy .unit-svg { animation: enemyIdle 2.7s ease-in-out infinite; }
.unit-hp { position: relative; width: 86%; height: 5px; margin-bottom: 2px; overflow: hidden; border-radius: 4px; background: rgba(9,34,40,.65); border: 1px solid rgba(246,255,251,.55); }
.unit-hp span { display: block; height: 100%; background: var(--turquoise-light); }
.unit.enemy .unit-hp span { background: var(--amber-light); }
.unit-guard { position: absolute; inset: 4%; border: 3px solid var(--turquoise-light); border-radius: 50%; box-shadow: inset 0 0 12px rgba(67,203,185,.5), 0 0 10px rgba(67,203,185,.5); animation: guardPulse 1.3s infinite; }
.intent-badge { position: absolute; z-index: 8; top: 2px; left: 2px; min-width: 25px; padding: 3px 5px; border-radius: 6px; color: var(--white); background: var(--plum-deep); border: 1px solid rgba(255,255,255,.5); font-size: clamp(7px,1.1vw,11px); font-weight: 900; line-height: 1; box-shadow: 0 2px 4px rgba(16,46,51,.25); }
.intent-badge.move { color: var(--ink); background: var(--amber-light); }
.intent-badge.heal { color: var(--ink); background: var(--turquoise-light); }
.intent-info { position: absolute; z-index: 9; top: 2px; right: 2px; width: 22px; height: 22px; padding: 0; border: 1px solid rgba(16,46,51,.35); border-radius: 50%; color: var(--ink); background: rgba(246,255,251,.85); font: 800 11px/1 var(--body); }
.board-legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; margin: 10px 0 0; color: var(--ink-soft); font-size: 10px; }
.legend-item { display: inline-flex; align-items: center; gap: 5px; }
.legend-symbol { width: 14px; height: 14px; display: inline-grid; place-items: center; border: 1px solid currentColor; font-size: 9px; font-weight: 900; }
.legend-symbol.threat { background: #dfc6aa; color: var(--plum-deep); }
.legend-symbol.move { border-style: dashed; color: #168a7d; }
.legend-symbol.crystal-legend { transform: rotate(45deg); color: #168a7d; background: var(--turquoise-light); }
.team-mini { display: flex; gap: 6px; margin-left: auto; }
.team-mini-dot { width: 12px; height: 16px; clip-path: polygon(50% 0,100% 35%,76% 100%,24% 100%,0 35%); background: var(--turquoise); }
.team-mini-dot.downed { background: #8a8f88; }
.sidebar-section + .sidebar-section { margin-top: 22px; padding-top: 20px; border-top: 1px solid rgba(182,255,240,.13); }
.sidebar-title { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; color: #9fc7c3; font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
.hero-row { width: 100%; display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 9px 7px; color: inherit; text-align: left; background: transparent; border: 1px solid transparent; border-radius: 10px; }
.hero-row:hover, .hero-row.selected { background: rgba(67,203,185,.1); border-color: rgba(67,203,185,.4); }
.hero-row.downed { opacity: .5; }
.hero-portrait { width: 32px; height: 40px; }
.hero-portrait svg { width: 100%; height: 100%; }
.hero-row-name { display: block; font: 500 15px/1.2 var(--display); }
.hero-row-meta { display: block; margin-top: 4px; color: #a9cbc6; font-size: 10px; }
.hero-state { color: var(--turquoise-light); font-size: 9px; font-weight: 800; text-align: right; }
.hp-track { display: block; height: 4px; margin-top: 6px; overflow: hidden; border-radius: 3px; background: rgba(255,255,255,.12); }
.hp-track span { display: block; height: 100%; background: var(--turquoise); }
.intent-row { width: 100%; display: grid; grid-template-columns: 30px 1fr; gap: 9px; padding: 9px 4px; color: inherit; text-align: left; border: 0; border-bottom: 1px solid rgba(182,255,240,.08); background: transparent; }
.intent-row:hover { background: rgba(255,255,255,.05); }
.intent-row-icon { display: grid; place-items: center; width: 28px; height: 28px; color: var(--amber-light); border: 1px solid rgba(255,225,160,.4); border-radius: 7px; font-weight: 900; }
.intent-row-name { display: block; font-size: 12px; font-weight: 750; }
.intent-row-text { display: block; margin-top: 3px; color: #a9cbc6; font-size: 10px; line-height: 1.45; }
.log-list { margin: 0; padding: 0; list-style: none; color: #a9cbc6; font-size: 10px; line-height: 1.5; }
.log-list li + li { margin-top: 6px; }
.hand-zone { margin-top: 16px; }
.hand-heading { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.hand-heading h2 { margin: 0; font: 500 18px/1 var(--display); }
.hand-heading span { color: var(--ink-soft); font-size: 10px; }
.end-turn { margin-left: auto; min-width: 160px; padding: 11px 18px; color: var(--white); background: var(--plum-deep); border: 2px solid var(--plum); border-radius: 12px; box-shadow: 0 5px 0 #321c31; font-weight: 800; }
.end-turn:hover { transform: translateY(-1px); background: #61345a; }
.end-turn:active { transform: translateY(3px); box-shadow: 0 2px 0 #321c31; }
.end-turn small { display: block; margin-top: 3px; color: #d8b7ce; font-size: 9px; font-weight: 500; }
.hand { display: grid; grid-template-columns: repeat(5,minmax(120px,1fr)); gap: 9px; }
.card { position: relative; min-width: 0; min-height: 205px; padding: 10px 10px 9px; overflow: hidden; color: var(--ink); text-align: left; border: 1px solid #b7b3a7; border-radius: 12px; background: linear-gradient(160deg, #fffdf5, #e8e3d5); box-shadow: 0 4px 0 #b0aca0, 0 8px 16px rgba(16,46,51,.12); transition: transform .15s, box-shadow .15s; }
.card:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 6px 0 #aaa69a, 0 14px 20px rgba(16,46,51,.18); }
.card.selected { transform: translateY(-6px); border: 2px solid var(--turquoise); box-shadow: 0 5px 0 #378f83, 0 0 20px rgba(67,203,185,.38); }
.card:disabled { opacity: .5; filter: saturate(.5); }
.card-hero { display: flex; align-items: center; gap: 5px; padding-right: 26px; color: var(--ink-soft); font-size: 8px; font-weight: 900; letter-spacing: .09em; text-transform: uppercase; }
.card-hero::before { content: ''; width: 7px; height: 7px; transform: rotate(45deg); background: var(--turquoise); }
.card.hero-scout .card-hero::before { background: var(--amber); }
.card.hero-artificer .card-hero::before { background: var(--plum); }
.card-cost { position: absolute; top: 7px; right: 8px; width: 25px; height: 29px; display: grid; place-items: center; color: var(--ink); background: linear-gradient(135deg,var(--white),var(--turquoise)); clip-path: polygon(50% 0,100% 35%,76% 100%,24% 100%,0 35%); font-size: 13px; font-weight: 900; }
.card-art { height: 58px; margin: 7px 0 5px; display: grid; place-items: center; color: var(--plum); border-top: 1px solid rgba(16,46,51,.1); border-bottom: 1px solid rgba(16,46,51,.1); background: radial-gradient(ellipse, rgba(67,203,185,.13), transparent 65%); }
.card-art svg { width: 58px; height: 58px; }
.card-name { display: block; font: 600 15px/1.1 var(--display); }
.card-target { display: block; margin-top: 4px; color: var(--plum); font-size: 8px; font-weight: 850; letter-spacing: .04em; text-transform: uppercase; }
.card-description { display: block; margin-top: 7px; color: var(--ink-soft); font-size: 10px; line-height: 1.35; }
.card-level { position: absolute; right: 8px; bottom: 6px; display: flex; gap: 3px; }
.card-level i { width: 6px; height: 6px; transform: rotate(45deg); background: var(--amber); }
.preview-panel { position: relative; display: grid; grid-template-columns: 1fr auto; gap: 14px; align-items: center; margin-top: 12px; padding: 13px 14px; color: var(--white); border-radius: 12px; background: var(--ink); box-shadow: var(--shadow); }
.preview-title { margin: 0 0 5px; color: var(--turquoise-light); font: 500 16px/1.2 var(--display); }
.preview-text { color: #d4e8e4; font-size: 11px; line-height: 1.55; }
.preview-actions { display: flex; gap: 7px; }
.preview-actions .primary-button { color: var(--ink); background: var(--amber-light); }
.preview-actions .secondary-button { color: var(--white); border-color: rgba(255,255,255,.3); background: transparent; }
.empty-hand { grid-column: 1/-1; padding: 28px; color: var(--ink-soft); text-align: center; border: 1px dashed rgba(16,46,51,.25); border-radius: 12px; font-size: 12px; }
.map-screen, .choice-screen, .ending-screen { padding: clamp(24px,4vw,54px); background: radial-gradient(circle at 90% 10%, rgba(67,203,185,.14), transparent 26rem), var(--paper); }
.map-title, .choice-heading { text-align: center; }
.map-title h1, .choice-heading h1 { font-size: clamp(30px,4vw,46px); }
.map-summary { display: flex; justify-content: center; gap: 10px; margin: 20px auto 26px; }
.summary-hero { min-width: 140px; display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid rgba(16,46,51,.15); border-radius: 10px; background: rgba(255,255,255,.38); }
.summary-hero .hero-portrait { width: 26px; height: 34px; }
.summary-hero-name { font-size: 11px; font-weight: 800; }
.summary-hero-hp { margin-top: 3px; color: var(--ink-soft); font-size: 10px; }
.expedition { display: grid; grid-template-columns: minmax(0,1fr) 260px; gap: 26px; max-width: 1120px; margin: auto; }

  }
  function renderBoard() {
    const combat = state.combat;
    const legal = currentLegalTargets();
    const cells = [];
    for (let y = 0; y < E.HEIGHT; y += 1) {
      for (let x = 0; x < E.WIDTH; x += 1) {
        const hero = state.heroes.find(item => item.x === x && item.y === y);
        const enemy = E.aliveEnemies(state).find(item => item.x === x && item.y === y);
        const crystal = E.crystalAt(state, x, y);
        const obstacle = E.obstacleAt(state, x, y);
        const hazard = E.hazardAt(state, x, y);
        const intent = enemy ? combat.intents.find(item => item.enemyId === enemy.id) : null;
        const incoming = E.incomingAt(state, x, y);
        const isLegal = legal.some(target => targetAtCell(target, x, y));
        const chosen = pending && (pending.targets || []).some(target => targetAtCell(target, x, y));
        const names = [coord({ x, y })];
        if (hero) names.push(heroName(hero.id), `${hero.hp} ${t('hp')}`);
        if (enemy) names.push(enemyName(enemy.type), `${enemy.hp} ${t('hp')}`, intent ? describeIntent(intent) : '');
        if (crystal) names.push(t('targetCrystal'));
        if (incoming) names.push(t('incoming', { amount: incoming }));
        cells.push(`<div class="cell ${obstacle ? 'obstacle' : ''} ${incoming ? 'threatened' : ''} ${isLegal ? 'legal' : ''} ${chosen ? 'chosen' : ''}" data-action="cell" data-x="${x}" data-y="${y}" role="button" tabindex="0" aria-label="${esc(names.filter(Boolean).join(' · '))}"><span class="cell-coordinate">${coord({ x, y })}</span>${obstacle ? '<span class="obstacle-shape"></span>' : ''}${hazard ? '<span class="hazard-shape"></span>' : ''}${crystal ? `<span class="crystal">${crystalSvg()}</span>` : ''}${incoming ? `<span class="threat-marker">×${incoming}</span>` : ''}${hero ? `<span class="unit hero ${hero.hp <= 0 ? 'downed' : ''}"><span class="unit-svg">${heroSvg(hero.id, hero.hp <= hero.maxHp / 2)}</span><span class="unit-hp"><span style="width:${Math.max(0, hero.hp / hero.maxHp * 100)}%"></span></span>${hero.guard ? '<span class="unit-guard"></span>' : ''}</span>` : ''}${enemy ? `<span class="unit enemy"><span class="unit-svg">${enemySvg(enemy.type, enemy.hp <= enemy.maxHp / 2)}</span><span class="unit-hp"><span style="width:${enemy.hp / enemy.maxHp * 100}%"></span></span></span>${intentBadge(intent)}<button class="intent-info" data-action="enemy-info" data-id="${enemy.id}" aria-label="${esc(t('details'))}: ${esc(enemyName(enemy.type))}">i</button>` : ''}</div>`);
      }
    }
    return `<div class="board-frame"><div class="board" role="grid" aria-label="7 × 5">${cells.join('')}</div></div><div class="board-legend"><span class="legend-item"><span class="legend-symbol threat">×</span>${esc(t('intents'))}</span><span class="legend-item"><span class="legend-symbol move">◆</span>${esc(t('selectAction'))}</span><span class="legend-item"><span class="legend-symbol crystal-legend"></span>${esc(t('targetCrystal'))}</span></div>`;
  }
  function renderSidebar() {
    const combat = state.combat;
    return `<aside class="battle-sidebar"><section class="sidebar-section"><h2 class="sidebar-title">${esc(t('team'))}</h2>${state.heroes.map(hero => `<button class="hero-row ${selectedHero === hero.id ? 'selected' : ''} ${hero.hp <= 0 ? 'downed' : ''}" data-action="hero" data-id="${hero.id}"><span class="hero-portrait">${heroSvg(hero.id, hero.hp <= hero.maxHp / 2)}</span><span><span class="hero-row-name">${esc(heroName(hero.id))}</span><span class="hero-row-meta">${hero.hp}/${hero.maxHp} ${esc(t('hp'))}${hero.guard ? ` · ${hero.guard} ${esc(t('guard'))}` : ''}</span><span class="hp-track"><span style="width:${Math.max(0, hero.hp / hero.maxHp * 100)}%"></span></span></span><span class="hero-state">${hero.hp <= 0 ? esc(t('downed')) : hero.moved ? esc(t('moved')) : esc(t('moveAvailable'))}</span></button>`).join('')}</section><section class="sidebar-section"><h2 class="sidebar-title">${esc(t('intents'))}<span>ⓘ</span></h2>${combat.intents.filter(intent => { const enemy = E.enemyById(state, intent.enemyId); return enemy && enemy.hp > 0; }).map(intent => { const enemy = E.enemyById(state, intent.enemyId); return `<button class="intent-row" data-action="enemy-info" data-id="${enemy.id}"><span class="intent-row-icon">${intent.type === 'move' ? '→' : intent.type === 'heal' ? '+' : '!'}</span><span><span class="intent-row-name">${esc(enemyName(enemy.type))}</span><span class="intent-row-text">${esc(describeIntent(intent))}</span></span></button>`; }).join('') || esc(t('noIntents'))}</section><section class="sidebar-section log-section"><h2 class="sidebar-title">${esc(t('log'))}</h2><ul class="log-list">${combat.log.slice(-5).reverse().map(logText).map(text => `<li>${esc(text)}</li>`).join('') || `<li>${esc(t('emptyLog'))}</li>`}</ul></section></aside>`;
  }
  function logText(entry) {
    const hero = entry.heroId ? heroName(entry.heroId) : '';
    const enemy = entry.enemyId && E.enemyById(state, entry.enemyId) ? enemyName(E.enemyById(state, entry.enemyId).type) : '';
    if (entry.type === 'heroHit') return t('heroHit', { hero, amount: entry.amount });
    if (entry.type === 'enemyHit') return t('enemyHit', { enemy, amount: entry.amount });
    if (entry.type === 'enemyDown') return t('enemyDown', { enemy });
    if (entry.type === 'guard') return t('guardLog', { hero, amount: entry.amount });
    if (entry.type === 'fortify') return t('fortifyLog', { amount: entry.amount });
    if (entry.type === 'thorns') return t('thornsLog');
    if (entry.type === 'shatter') return t('shatterLog');
    if (entry.type === 'resonance') return t('resonanceLog');
    if (entry.type === 'swap') return t('swapLog');
    if (entry.type === 'mend') return t('mendLog', { hero, amount: entry.amount });
    if (entry.type === 'move') return t('moveLog', { hero });
    if (entry.type === 'vault') return t('vaultLog', { hero });
    if (entry.type === 'reshuffle') return t('reshuffle');
    if (entry.type === 'turn') return t('turnLog', { turn: entry.turn });
    if (entry.type === 'bossPhase') return t('bossPhaseLog');
    if (entry.type === 'bossStart') return t('bossStart');
    if (entry.type === 'combatStart') return t('combatStart');
    if (entry.type === 'push') return t('pushLog', { enemy });
    if (entry.type === 'enemyHeal') return t('enemyHealLog', { enemy, amount: entry.amount });
    if (entry.type === 'edge' && entry.isolated) return t('edgeLog');
    return t('emptyLog');
  }
  function renderCard(instance) {
    const card = E.cardInfo(state, instance.id);
    const actor = E.heroById(state, card.hero);
    const description = cardText(instance.id)[1].replaceAll('{value}', card.value).replaceAll('{range}', card.range);
    const disabled = state.combat.energy < card.cost || !actor || actor.hp <= 0;
    return `<button class="card hero-${card.hero} ${selectedCard === instance.uid ? 'selected' : ''}" data-action="card" data-uid="${instance.uid}" ${disabled ? 'disabled' : ''} aria-pressed="${selectedCard === instance.uid}"><span class="card-cost">${card.cost}</span><span class="card-hero">${esc(heroName(card.hero))}</span><span class="card-art">${iconSvg(instance.id)}</span><span class="card-name">${esc(cardName(instance.id))}</span><span class="card-target">${esc(t('range'))} ${card.range || '—'} · ${esc(targetLabel(card))}</span><span class="card-description">${esc(description)}</span>${card.level ? `<span class="card-level" title="${esc(t('upgraded'))}">${'<i></i>'.repeat(card.level)}</span>` : ''}</button>`;
  }
  function describePending() {
    if (!pending) return '';
    const lines = [];
    if (pending.kind === 'move') {
      lines.push(t('incomingChange', { before: pending.incomingBefore, after: pending.incomingAfter }));
    } else {
      const instance = state.combat.hand.find(card => card.uid === pending.uid);
      if (instance) lines.push(`${cardName(instance.id)} · ${t('energyPreview', { before: state.combat.energy, after: pending.changes.energyAfter })}`);
      if (pending.isolated) lines.push(t('isolated'));
      if (instance && instance.id === 'shatter') lines.push(t('crystalRemoved'));
    }
    pending.changes.heroes.forEach(change => {
      const parts = [];
      if (change.hpBefore !== change.hpAfter) parts.push(`${t('hp')} ${change.hpBefore} → ${change.hpAfter}`);
      if (change.guardBefore !== change.guardAfter) parts.push(`${t('guard')} ${change.guardBefore} → ${change.guardAfter}`);
      if (change.from.x !== change.to.x || change.from.y !== change.to.y) parts.push(`${coord(change.from)} → ${coord(change.to)}`);
      if (parts.length) lines.push(`${heroName(change.id)}: ${parts.join(' · ')}`);
    });
    pending.changes.enemies.forEach(change => {
      const enemy = E.enemyById(state, change.id);
      const parts = [];
      if (change.hpBefore !== change.hpAfter) parts.push(`${t('hp')} ${change.hpBefore} → ${change.hpAfter}`);
      if (change.from.x !== change.to.x || change.from.y !== change.to.y) parts.push(`${coord(change.from)} → ${coord(change.to)}`);
      if (parts.length) lines.push(`${enemy ? enemyName(enemy.type) : change.id}: ${parts.join(' · ')}`);
    });
    return lines.join('  |  ') || t('noChange');
  }
  function renderPreview() {
    if (!pending) return '';
    return `<div class="preview-panel" role="region" aria-label="${esc(t('previewCard'))}"><div><h3 class="preview-title">${esc(t(pending.kind === 'move' ? 'previewMove' : 'previewCard'))}</h3><div class="preview-text">${esc(describePending())}</div></div><div class="preview-actions"><button class="secondary-button" data-action="cancel">${esc(t('cancel'))}</button><button class="primary-button" data-action="confirm">${esc(t('confirm'))}</button></div></div>`;
  }
  function renderCombat() {
    const combat = state.combat;
    const layoutName = NODE_TEXT.layouts[lang][combat.layout] || NODE_TEXT.layouts.en[combat.layout];
    return `<main class="screen game-layout"><section class="battle-main"><div class="battle-heading"><div><h1>${esc(nodeName(state.currentNode))}</h1><p>${esc(layoutName)} · ${combat.final ? esc(t('final')) : esc(t('combat'))}</p></div><span class="turn-chip">${esc(t('turn'))} ${combat.turn}</span>${combat.final ? `<div class="boss-phase">${esc(t(combat.bossPhase === 2 ? 'bossPhaseLog' : 'helpBoss'))}</div>` : ''}</div><div class="battle-status"><div class="energy-meter"><span class="energy-label">${esc(t('energy'))}</span>${[0, 1, 2].map(index => `<span class="energy-orb ${index < combat.energy ? '' : 'empty'}">${index < combat.energy ? '◆' : ''}</span>`).join('')}</div><span class="pile-count">${esc(t('draw'))} <strong>${combat.deck.length}</strong></span><span class="pile-count">${esc(t('discard'))} <strong>${combat.discard.length}</strong></span><span class="team-mini">${state.heroes.map(hero => `<span class="team-mini-dot ${hero.hp <= 0 ? 'downed' : ''}"></span>`).join('')}</span></div>${renderBoard()}<section class="hand-zone"><div class="hand-heading"><h2>${esc(t('hand'))}</h2><span>${esc(t('handHelp'))}</span><button class="end-turn" data-action="end-turn">${esc(t('endTurn'))}<small>${esc(t('endHint'))}</small></button></div><div class="hand">${combat.hand.length ? combat.hand.map(renderCard).join('') : `<div class="empty-hand">${esc(t('emptyHand'))}</div>`}</div>${renderPreview()}</section></section>${renderSidebar()}</main>`;
  }
  function renderModal() {
    if (!modal) { modalRoot.innerHTML = ''; return; }
    let title = t('helpTitle');
    let body = '';
    if (modal.type === 'help') {
      body = `<p>${esc(t('helpGoal'))}</p><h3>${esc(t('turn'))}</h3><p>${esc(t('helpTurn'))}</p><h3>${esc(t('hand'))}</h3><p>${esc(t('helpCards'))}</p><h3>${esc(t('intents'))}</h3><p>${esc(t('helpIntent'))}</p><div class="rule-grid"><div class="rule-item"><strong>${esc(t('helpElements').split('.')[0])}</strong>${esc(t('helpElements'))}</div><div class="rule-item"><strong>${esc(t('final'))}</strong>${esc(t('helpBoss'))}</div></div><h3>${esc(t('helpControls').split('.')[0])}</h3><p>${esc(t('helpControls'))}</p>`;
    } else if (modal.type === 'enemy') {
      const enemy = E.enemyById(state, modal.id);
      if (!enemy) { modalRoot.innerHTML = ''; return; }
      const intent = state.combat.intents.find(item => item.enemyId === enemy.id);
      title = enemyName(enemy.type);
      const behaviorKey = { hound: 'behaviorHound', sentry: 'behaviorSentry', ram: 'behaviorRam', weaver: 'behaviorWeaver', boss: 'behaviorBoss' }[enemy.type];
      body = `<p>${enemy.hp}/${enemy.maxHp} ${esc(t('hp'))} · ${coord(enemy)}</p><p>${esc(t(behaviorKey))}</p><div class="intent-detail"><strong>${esc(t('intents'))}</strong><br>${esc(describeIntent(intent))}</div><p>${esc(t('helpIntent'))}</p>`;
    } else {
      title = t('targetCrystal');
      body = `<p>${esc(t('helpElements'))}</p><p>${esc(cardText('shatter')[1].replaceAll('{value}', E.cardInfo(state, 'shatter').value))}</p><p>${esc(cardText('resonance')[1].replaceAll('{value}', E.cardInfo(state, 'resonance').value))}</p>`;
    }
    modalRoot.innerHTML = `<div class="modal-backdrop" data-action="close-modal"><section class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}" data-modal-panel><div class="modal-header"><h2>${esc(title)}</h2><button class="icon-button" data-action="close-modal" aria-label="${esc(t('close'))}">×</button></div><div class="modal-body">${body}</div></section></div>`;
  }
  function render() {
    document.documentElement.lang = lang;
    document.title = t('title');
    const content = view === 'home' ? renderHome() : state.screen === 'map' ? renderMap() : state.screen === 'combat' ? renderCombat() : state.screen === 'reward' ? renderReward() : state.screen === 'rest' ? renderRest() : state.screen === 'event' ? renderEvent() : renderEnding();
    app.innerHTML = `<div class="app-shell">${renderTopbar()}${content}</div>${autoplay && view === 'game' ? `<button class="autoplay-banner" data-action="stop-autoplay">${esc(t('autoplay'))} · ${esc(t('stopAutoplay'))}</button>` : ''}`;
    renderModal();
    scheduleAutoplay();
  }

  function clearSelection() {
    selectedHero = null;
    selectedCard = null;
    selectedTargets = [];
    pending = null;
  }
  function afterAction(result) {
    if (!result || !result.ok) {
      toast(result && result.error ? result.error : t('noTargets'));
      render();
      return false;
    }
    clearSelection();
    saveGame();
    if (state.screen === 'ending') playSound(state.ending && state.ending.victory ? 'victory' : 'hit');
    else if (result.cardId === 'safeguard' || result.cardId === 'fortify') playSound('guard');
    else playSound('hit');
    render();
    return true;
  }
  function startNew(seed) {
    clearSelection();
    modal = null;
    state = E.createExpedition(seed || requestedSeed || randomSeed());
    savedState = E.clone(state);
    view = 'game';
    saveGame();
    render();
  }
  function stopAutoplay() {
    autoplay = false;
    clearTimeout(autoTimer);
    autoTimer = null;
  }
  function scheduleAutoplay() {
    if (!autoplay || view !== 'game' || !state || state.screen === 'ending' || autoTimer || autoBusy) return;
    autoTimer = setTimeout(() => {
      autoTimer = null;
      if (!autoplay || view !== 'game') return;
      const action = E.autoAction(state);
      if (!action) return;
      const result = E.applyAction(state, action);
      afterAction(result);
    }, 620);
  }
  function sameTarget(a, b) {
    return a.kind === b.kind && a.id === b.id && a.x === b.x && a.y === b.y;
  }
  function chooseCardTarget(target) {
    const legal = E.getCardTargets(state, selectedCard, selectedTargets);
    const match = legal.find(item => sameTarget(item, target));
    if (!match) return false;
    selectedTargets.push(match);
    const instance = state.combat.hand.find(card => card.uid === selectedCard);
    if (!instance) { clearSelection(); return false; }
    const required = E.CARDS[instance.id].target === 'twoHeroes' ? 2 : 1;
    if (selectedTargets.length < required) { render(); return true; }
    const preview = E.previewCard(state, selectedCard, selectedTargets);
    if (!preview.ok) { toast(preview.error); clearSelection(); render(); return false; }
    pending = preview;
    render();
    return true;
  }
  function showHelp() { modal = { type: 'help' }; render(); }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    if (action === 'close-modal' && event.target.closest('[data-modal-panel]') && !event.target.closest('button[data-action="close-modal"]')) return;
    if (['node', 'card', 'hero', 'cell', 'confirm', 'end-turn', 'reward', 'rest', 'event'].includes(action) && autoplay) stopAutoplay();
    if (action === 'language') {
      lang = button.dataset.lang;
      savePreferences();
      render();
    } else if (action === 'sound') {
      preferences.sound = !preferences.sound;
      savePreferences();
      if (preferences.sound) playSound('guard');
      render();
    } else if (action === 'help') showHelp();
    else if (action === 'close-modal') { modal = null; render(); }
    else if (action === 'home') {
      if (state && view === 'game') saveGame();
      stopAutoplay();
      savedState = state ? E.clone(state) : readSave();
      view = 'home';
      clearSelection();
      modal = null;
      render();
    } else if (action === 'new-game') { stopAutoplay(); startNew(); }
    else if (action === 'continue' && savedState) {
      stopAutoplay();
      state = E.clone(savedState);
      view = 'game';
      clearSelection();
      render();
    } else if (action === 'watch') {
      stopAutoplay();
      autoplay = true;
      startNew('first-light');
    } else if (action === 'stop-autoplay') { stopAutoplay(); render(); }
    else if (action === 'retry') { stopAutoplay(); startNew(state.seed); }
    else if (action === 'node') {
      clearSelection();
      afterAction(E.startNode(state, button.dataset.id));
    } else if (action === 'card') {
      pending = null;
      selectedTargets = [];
      selectedHero = null;
      selectedCard = selectedCard === button.dataset.uid ? null : button.dataset.uid;
      if (selectedCard && !E.getCardTargets(state, selectedCard).length) toast(t('noTargets'));
      render();
    } else if (action === 'hero') {
      if (selectedCard && chooseCardTarget({ kind: 'hero', id: button.dataset.id })) return;
      clearSelection();
      selectedHero = button.dataset.id;
      if (!E.getMoveTargets(state, selectedHero).length) toast(t('noTargets'));
      render();
    } else if (action === 'cell') {
      const x = Number(button.dataset.x);
      const y = Number(button.dataset.y);
      if (selectedCard) {
        const target = currentLegalTargets().find(item => targetAtCell(item, x, y));
        if (target) { chooseCardTarget(target); return; }
      }
      if (selectedHero) {
        const target = currentLegalTargets().find(item => item.kind === 'cell' && item.x === x && item.y === y);
        if (target) {
          pending = E.previewMove(state, selectedHero, target);
          render();
          return;
        }
      }
      const hero = state.heroes.find(item => item.hp > 0 && item.x === x && item.y === y);
      const enemy = E.aliveEnemies(state).find(item => item.x === x && item.y === y);
      const crystal = E.crystalAt(state, x, y);
      clearSelection();
      if (hero) selectedHero = hero.id;
      else if (enemy) modal = { type: 'enemy', id: enemy.id };
      else if (crystal) modal = { type: 'crystal' };
      render();
    } else if (action === 'enemy-info') {
      clearSelection();
      modal = { type: 'enemy', id: button.dataset.id };
      render();
    } else if (action === 'cancel') { clearSelection(); render(); }
    else if (action === 'confirm' && pending) {
      const result = pending.kind === 'move' ? E.moveHero(state, pending.heroId, pending.target) : E.playCard(state, pending.uid, pending.targets);
      afterAction(result);
    } else if (action === 'end-turn') { clearSelection(); afterAction(E.endTurn(state)); }
    else if (action === 'reward') afterAction(E.chooseReward(state, button.dataset.id));
    else if (action === 'rest') afterAction(E.chooseRest(state, button.dataset.id));
    else if (action === 'event') afterAction(E.chooseEvent(state, button.dataset.id));
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (modal) modal = null;
      else clearSelection();
      render();
      return;
    }
    if (event.key.toLowerCase() === 'm' && !event.ctrlKey && !event.metaKey) {
      preferences.sound = !preferences.sound;
      savePreferences();
      render();
      return;
    }
    const cell = event.target.closest && event.target.closest('.cell[role=button]');
    if (cell && (event.key === 'Enter' || event.key === ' ')) {
      event.preventDefault();
      cell.click();
      return;
    }
    if (event.code === 'Space' && view === 'game' && state && state.screen === 'combat' && !modal && !event.target.closest('button')) {
      event.preventDefault();
      stopAutoplay();
      clearSelection();
      afterAction(E.endTurn(state));
    }
  });

  savedState = readSave();
  if (autoplay) {
    state = E.createExpedition(requestedSeed || 'first-light');
    view = 'game';
    saveGame();
  }
  render();
})();
</script>
</body>
</html>
